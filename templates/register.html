{% extends "base.html" %}

{% block nav %}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-icon">
            <i class="bi bi-person-plus"></i>
        </div>
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Sign up to get started with IoT Pipeline</p>

        <form id="register-form">
            <div class="mb-3">
                <label for="display_name" class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person-fill"></i>
                    </span>
                    <input type="text" class="form-control" id="display_name" name="display_name" required placeholder="John Doe">
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-envelope-fill"></i>
                    </span>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="you@example.com">
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••" minlength="6">
                </div>
                <div class="form-text">Password must be at least 6 characters</div>
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="••••••••" minlength="6">
                </div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="terms" required>
                <label class="form-check-label text-muted" for="terms">
                    I agree to the <a href="#" class="auth-link">Terms</a> and <a href="#" class="auth-link">Privacy</a>
                </label>
            </div>

            <div id="loading" style="display: none; text-align: center; padding: 20px;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 mb-3">
                <i class="bi bi-person-plus"></i> Create Account
            </button>
        </form>

        <hr class="auth-divider">

        <div class="text-center mb-3">
            <p class="mb-2 text-muted small">Or sign up with</p>
            <div class="d-flex gap-2 justify-content-center">
                <button class="btn btn-social btn-social-google" onclick="signInWithGoogle()">
                    <i class="bi bi-google"></i> Google
                </button>
                <button class="btn btn-social btn-social-github" onclick="signInWithGitHub()">
                    <i class="bi bi-github"></i> GitHub
                </button>
            </div>
        </div>

        <div class="auth-footer-panel">
            <p class="mb-0 text-secondary">Already have an account? <a href="/login" class="auth-link">Sign In &rarr;</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('register-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const displayName = document.getElementById('display_name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    // Validate passwords match
    if (password !== confirmPassword) {
        showAlert('Passwords do not match', 'danger');
        return;
    }
    
    showLoading();
    
    try {
        // Create user with Firebase Auth
        const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
        
        // Update display name
        await userCredential.user.updateProfile({ displayName: displayName });
        
        // Register with backend
        const response = await fetch('/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email: email,
                password: password,
                display_name: displayName
            })
        });
        
        const result = await response.json();
        
        if (result.success) {
            showAlert('Account created successfully!', 'success');
            setTimeout(() => {
                window.location.href = '/login';
            }, 1500);
        } else {
            showAlert('Registration failed: ' + result.error, 'danger');
            // Clean up Firebase user if backend registration failed
            await userCredential.user.delete();
        }
        
    } catch (error) {
        console.error('Registration error:', error);
        showAlert('Registration failed: ' + error.message, 'danger');
    }
    
    hideLoading();
});

async function signInWithGoogle() {
    try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await firebase.auth().signInWithPopup(provider);
        
        // Register with backend
        const response = await fetch('/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email: result.user.email,
                password: '', // No password for OAuth
                display_name: result.user.displayName
            })
        });
        
        const registerResult = await response.json();
        
        if (registerResult.success || registerResult.error.includes('already')) {
            showAlert('Account created successfully!', 'success');
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 1000);
        }
    } catch (error) {
        console.error('Google sign-up error:', error);
        showAlert('Google sign-up failed: ' + error.message, 'danger');
    }
}

async function signInWithGitHub() {
    try {
        const provider = new firebase.auth.GithubAuthProvider();
        const result = await firebase.auth().signInWithPopup(provider);
        
        // Register with backend
        const response = await fetch('/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email: result.user.email,
                password: '',
                display_name: result.user.displayName
            })
        });
        
        const registerResult = await response.json();
        
        if (registerResult.success || registerResult.error.includes('already')) {
            showAlert('Account created successfully!', 'success');
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 1000);
        }
    } catch (error) {
        console.error('GitHub sign-up error:', error);
        showAlert('GitHub sign-up failed: ' + error.message, 'danger');
    }
}
</script>
{% endblock %}
