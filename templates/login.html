{% extends "base.html" %}

{% block nav %}{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-icon">
            <i class="bi bi-cpu"></i>
        </div>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to your IoT Pipeline account</p>

        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-envelope-fill"></i>
                    </span>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="you@example.com">
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label text-muted" for="remember">Remember me</label>
                </div>
                <a href="/forgot-password" class="auth-link">Forgot password?</a>
            </div>

            <div id="loading" style="display: none; text-align: center; padding: 20px;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>

        <hr class="auth-divider">

        <div class="text-center mb-3">
            <p class="mb-2 text-muted small">Or sign in with</p>
            <div class="d-flex gap-2 justify-content-center">
                <button class="btn btn-social btn-social-google" onclick="signInWithGoogle()">
                    <i class="bi bi-google"></i> Google
                </button>
                <button class="btn btn-social btn-social-github" onclick="signInWithGitHub()">
                    <i class="bi bi-github"></i> GitHub
                </button>
            </div>
        </div>

        <div class="auth-footer-panel">
            <p class="mb-0 text-secondary">Don't have an account? <a href="/register" class="auth-link">Create Account &rarr;</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    showLoading();
    
    try {
        // Sign in with Firebase Auth
        const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
        
        // Get ID token
        const idToken = await userCredential.user.getIdToken();
        
        // Verify token with backend
        const response = await fetch('/auth/verify', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ id_token: idToken })
        });
        
        const result = await response.json();
        
        if (result.success) {
            showAlert('Login successful!', 'success');
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 1000);
        } else {
            showAlert('Login failed: ' + result.error, 'danger');
        }
        
    } catch (error) {
        console.error('Login error:', error);
        showAlert('Login failed: ' + error.message, 'danger');
    }
    
    hideLoading();
});

async function signInWithGoogle() {
    try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await firebase.auth().signInWithPopup(provider);
        
        const idToken = await result.user.getIdToken();
        
        const response = await fetch('/auth/verify', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ id_token: idToken })
        });
        
        const verifyResult = await response.json();
        
        if (verifyResult.success) {
            showAlert('Login successful!', 'success');
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 1000);
        }
    } catch (error) {
        console.error('Google sign-in error:', error);
        showAlert('Google sign-in failed: ' + error.message, 'danger');
    }
}

async function signInWithGitHub() {
    try {
        const provider = new firebase.auth.GithubAuthProvider();
        const result = await firebase.auth().signInWithPopup(provider);
        
        const idToken = await result.user.getIdToken();
        
        const response = await fetch('/auth/verify', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ id_token: idToken })
        });
        
        const verifyResult = await response.json();
        
        if (verifyResult.success) {
            showAlert('Login successful!', 'success');
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 1000);
        }
    } catch (error) {
        console.error('GitHub sign-in error:', error);
        showAlert('GitHub sign-in failed: ' + error.message, 'danger');
    }
}
</script>
{% endblock %}
