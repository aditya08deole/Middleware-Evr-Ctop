events {
    worker_connections 1024;
}

http {
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;

    upstream ctop_middleware {
        server middleware:8080;
    }

    server {
        listen 80;
        server_name _;

        # TLS termination goes here once you have real certificates (e.g.
        # via certbot/Let's Encrypt). Uncomment and point at mounted cert
        # files — see the commented-out nginx service block in
        # docker-compose.yml for the matching volume mount:
        #
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;

        client_max_body_size 5m;

        location / {
            proxy_pass http://ctop_middleware;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Quiet, unlogged path for the container healthcheck / load balancer
        # probes so they don't spam the access log every few seconds.
        location /health {
            proxy_pass http://ctop_middleware/health;
            access_log off;
        }
    }
}
