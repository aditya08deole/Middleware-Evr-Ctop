version: '3.8'

services:
  middleware:
    build: .
    container_name: evara-middleware
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Persistent storage for the SQLite mirror database
      - ./instance:/app/instance
      # Optional: mount service account key if not in the code folder
      # - ./service-account-key.json:/app/service-account-key.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
